plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.13'
}

group = 'edu.metrostate.ProjectPhase2'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // Jackson JSON/XML dependencies
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.15.2'
    
    // JavaFX additional modules and controls
    implementation 'org.controlsfx:controlsfx:11.2.1'
    implementation 'com.dlsc.formsfx:formsfx-core:11.6.0'
    implementation 'net.synedra:validatorfx:0.4.0'
    implementation 'org.kordamp.ikonli:ikonli-javafx:12.3.1'
    implementation 'org.kordamp.bootstrapfx:bootstrapfx-core:0.4.0'
    implementation 'eu.hansolo:tilesfx:11.48'
    
    // Testing dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:5.9.2'
    testImplementation 'org.mockito:mockito-core:5.1.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.1.1'
    testImplementation 'org.junit.platform:junit-platform-suite:1.9.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    
    // JavaFX for testing
    testImplementation 'org.openjfx:javafx-swing:21.0.3'
}

javafx {
    version = '21.0.3'
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.web' ]
}

// Configure custom source directory
sourceSets {
    main {
        java {
            srcDirs = ['ICS372_Group3_ProjectPhase2/src/main/java']
        }
        resources {
            srcDirs = ['ICS372_Group3_ProjectPhase2/src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['ICS372_Group3_ProjectPhase2/src/test/java']
        }
        resources {
            srcDirs = ['ICS372_Group3_ProjectPhase2/src/test/resources']
        }
    }
}

// Configure test task
test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

application {
    mainClass = 'edu.metrostate.ics372_phase2.Main'
}

// Ensure the JAR is executable with the correct entry point
tasks.withType(Jar).configureEach {
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
}
